# \u57FA\u7840\u914D\u7F6E
server.port=8080
debug=false
spring.main.allow-circular-references=true

# Spring Security \u9ED8\u8BA4\u7528\u6237
#spring.security.user.name=admin
#spring.security.user.password=123456

# Magic API \u7F16\u8F91\u5668\u914D\u7F6E
#magic-api.editor-config=classpath:editor-config.js

# \u6570\u636E\u6E90\u914D\u7F6E
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.68.136:3306/user-manage?serverTimezone=Asia/Shanghai&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456789

# Web \u8D44\u6E90\u914D\u7F6E
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/

# MyBatis Plus \u914D\u7F6E
mybatis-plus.mapper-locations=classpath*:/mapper/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# \u6587\u4EF6\u4E0A\u4F20\u914D\u7F6E
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload.path=E:/springboot+vue3/springboot/uploads

# Thymeleaf \u6A21\u677F\u914D\u7F6E
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.servlet.content-type=text/html

# Swagger/OpenAPI \u914D\u7F6E
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html





# \u65E5\u5FD7\u914D\u7F6E
logging.level.root=WARN
logging.level.com.gpan.springboot.mapper=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
